@let item = book();
<a
  [routerLink]="['/books', item.id]"
  tabindex="0"
  [attr.aria-label]="'View details for ' + item.title"
  class="bg-white rounded-lg shadow-md overflow-hidden hover:shadow-xl transition-shadow duration-300 flex flex-col h-full focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-blue-700"
>
  <div class="relative aspect-[3/4] overflow-hidden">
    @if (item.cover) {
      <img [src]="item.cover" [alt]="item.title" class="w-full h-full object-contain bg-gray-100" />
    } @else {
      <div class="w-full h-full bg-gray-100 flex items-center justify-center">
        <span class="text-gray-500 text-sm font-medium">No cover available</span>
      </div>
    }
  </div>
  <div class="p-5 flex flex-col flex-grow">
    <h2 class="text-lg font-semibold text-gray-800 mb-1 line-clamp-2">{{ item.title }}</h2>
    @if (item.subtitle) {
      <p class="text-sm text-gray-600 mb-2 line-clamp-2">{{ item.subtitle }}</p>
    }
    <div class="text-sm text-gray-700 mt-auto">
      <p>
        <span class="text-blue-700">{{ item.author }}</span>
      </p>
      @if (item.isbn) {
        <p class="text-xs text-gray-500 mt-2">ISBN: {{ item.isbn }}</p>
      }
    </div>
  </div>
</a>
