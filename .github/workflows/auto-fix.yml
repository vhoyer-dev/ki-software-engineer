name: Auto-Fix CI Failures with Codex

on:
  workflow_run:
    workflows:
      - Codex Code Review
      - Issue Implementation with Codex
    types:
      - completed

jobs:
  auto-fix:
    # Repair trusted repository branches once; do not chain repairs of repair branches.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      !startsWith(github.event.workflow_run.head_branch, 'auto-fix/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      GH_REPO: ${{ github.repository }}
      BASE_BRANCH: ${{ github.event.workflow_run.head_branch }}
      FAILED_SHA: ${{ github.event.workflow_run.head_sha }}
      FAILED_RUN_URL: ${{ github.event.workflow_run.html_url }}
      FIX_BRANCH: auto-fix/${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      # Fine-grained PAT for this repository: Contents, Pull requests and Workflows: write.
      # Use it only for publication, including fixes to .github/workflows files.
      - name: Check publication token
        env:
          AUTO_FIX_TOKEN: ${{ secrets.AUTO_FIX_TOKEN }}
        run: |
          if [ -z "$AUTO_FIX_TOKEN" ]; then
            echo '::error::Set AUTO_FIX_TOKEN with Contents, Pull requests and Workflows write permissions.'
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Use the SHA from the failed workflow run
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare repair branch
        run: |
          set -euo pipefail
          git check-ref-format --branch "$BASE_BRANCH"
          git show-ref --verify "refs/remotes/origin/$BASE_BRANCH"
          git switch -c "$FIX_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download failed workflow logs
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh run view "$FAILED_RUN_ID" --log-failed > "$RUNNER_TEMP/failed-workflow.log"

      - name: Configure Codex
        run: |
          mkdir -p "$RUNNER_TEMP/codex-home"
          cat > "$RUNNER_TEMP/codex-home/config.toml" <<'EOF'
          default_permissions = "github-autofix"

          [features]
          network_proxy = true

          [permissions.github-autofix]
          extends = ":workspace"

          [permissions.github-autofix.network]
          enabled = true

          [permissions.github-autofix.network.domains]
          "api.github.com" = "allow"
          "fonts.googleapis.com" = "allow"
          "fonts.gstatic.com" = "allow"
          "registry.npmjs.org" = "allow"
          EOF

      - name: Run Codex Auto-Fix
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-home: ${{ runner.temp }}/codex-home
          permission-profile: github-autofix
          safety-strategy: drop-sudo
          model: 'gpt-5.6-luna'
          output-file: ${{ runner.temp }}/auto-fix-summary.md
          prompt: |
            A CI build has failed. Analyze the errors and fix them automatically.

            **Build Details:**
            - Repository: ${{ github.repository }}
            - Workflow: ${{ github.event.workflow_run.name }}
            - Branch: ${{ github.event.workflow_run.head_branch }}
            - Commit: ${{ github.event.workflow_run.head_sha }}
            - Workflow Run URL: ${{ github.event.workflow_run.html_url }}

            **Your Task:**
            1. Read "$RUNNER_TEMP/failed-workflow.log" and analyze the errors
            2. Identify the root causes (build errors, linting problems, tests, etc.)
            3. Perform automatic fixes for:
               - YAML syntax errors in frontmatter
               - TypeScript/JavaScript errors
               - Import/export problems
               - Package.json dependencies
            4. Test the fixes locally with `npm run build`
            5. Leave the fixes uncommitted and summarize the root cause, changes and validation

            **Important Rules:**
            - Follow the repository's AGENTS.md files for style and conventions
            - Stay on the prepared repair branch; do not commit, push, or create a PR yourself
            - The workflow independently runs the build, commits, pushes, and creates a PR
            - A failed or blocked build is not successful validation; report it explicitly
            - Do not disable checks or remove tests to hide failures
            - For critical or unresolvable errors, explain the blocker; the workflow reports failures as issues

            Begin by analyzing the workflow logs!

      - name: Verify fixes with build test
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$FIX_BRANCH"
          test "$(git rev-parse HEAD)" = "$FAILED_SHA"
          test -s "$RUNNER_TEMP/auto-fix-summary.md"
          git diff --check
          git diff --cached --check
          npm run build

      - name: Commit verified fixes
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo '::error::Codex produced no fixes to publish.'
            exit 1
          fi
          git diff --cached --check
          git commit -m "fix: repair CI failure from run ${{ github.event.workflow_run.id }}"

      - name: Push repair branch and create pull request
        env:
          GH_TOKEN: ${{ secrets.AUTO_FIX_TOKEN }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git push --set-upstream origin "$FIX_BRANCH"
          {
            printf '## CI repair\n\nFailed run: %s\n\n' "$FAILED_RUN_URL"
            printf 'Failed commit: `%s`\n\n' "$FAILED_SHA"
            cat "$RUNNER_TEMP/auto-fix-summary.md"
            printf '\n\n## Validation\n\n- Passed: `npm run build`\n- Passed: `git diff --check`\n'
          } > "$RUNNER_TEMP/auto-fix-pr.md"
          PR_URL=$(gh pr create --base "$BASE_BRANCH" --head "$FIX_BRANCH" \
            --title "fix: repair CI failure from run ${{ github.event.workflow_run.id }}" \
            --body-file "$RUNNER_TEMP/auto-fix-pr.md")
          printf 'Repair pull request: %s\n' "$PR_URL" >> "$GITHUB_STEP_SUMMARY"

  notify-failure:
    if: ${{ always() && needs.auto-fix.result == 'failure' }}
    needs: auto-fix
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create issue for failed auto-fix
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🤖 Auto-Fix Failed - Manual Intervention Required',
              body: `## Auto-Fix Error

            The automatic fix for the CI error has failed.

            **Details:**
            - Workflow: ${{ github.event.workflow_run.name }}
            - Branch: ${{ github.event.workflow_run.head_branch }}
            - Commit: ${{ github.event.workflow_run.head_sha }}
            - Auto-Fix Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - Original Failed Run: ${{ github.event.workflow_run.html_url }}

            Please review the logs and fix the issues manually.`,
              labels: ['bug', 'auto-fix-failed', 'needs-attention']
            })
